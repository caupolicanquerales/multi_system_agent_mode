---
type: specs.openrewrite.org/v1beta/recipe
name: com.custom.openrewrite.MigrateLegacyDependencies
recipeList:
  # 1. Inyección de BOMs gestionados
  - org.openrewrite.maven.AddManagedDependency:
      groupId: org.springframework
      artifactId: spring-framework-bom
      version: 6.1.14
      type: pom
      scope: import
  - org.openrewrite.maven.AddManagedDependency:
      groupId: jakarta.platform
      artifactId: jakarta.jakartaee-bom
      version: 10.0.0
      type: pom
      scope: import

  # 2. Migración del código Java (Sustitución de anotaciones e imports de Swagger / Springfox)
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@springfox.documentation.swagger2.annotations.EnableSwagger2"

  # Mapeo directo de tipos antiguos a OpenAPI v3
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.swagger.annotations.Api
      newFullyQualifiedTypeName: io.swagger.v3.oas.annotations.tags.Tag
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.swagger.annotations.ApiOperation
      newFullyQualifiedTypeName: io.swagger.v3.oas.annotations.Operation
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.swagger.annotations.ApiParam
      newFullyQualifiedTypeName: io.swagger.v3.oas.annotations.Parameter
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: springfox.documentation.spring.web.plugins.Docket
      newFullyQualifiedTypeName: io.swagger.v3.oas.models.OpenAPI
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: springfox.documentation.builders.ApiInfoBuilder
      newFullyQualifiedTypeName: io.swagger.v3.oas.models.info.Info

  # 3. Sustitución e Intercambio de Dependencias en el POM
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: io.springfox
      oldArtifactId: springfox-swagger2
      newGroupId: org.springdoc
      newArtifactId: springdoc-openapi-starter-webmvc-ui
      newVersion: 2.6.0
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: commons-lang
      oldArtifactId: commons-lang
      newGroupId: org.apache.commons
      newArtifactId: commons-lang3
      newVersion: 3.14.0
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: javax.servlet
      oldArtifactId: servlet-api
      newGroupId: jakarta.servlet
      newArtifactId: jakarta.servlet-api
      newVersion: 6.0.0

  # Actualizaciones explícitas de versiones gestionadas
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: com.fasterxml.jackson.core
      artifactId: jackson-databind
      newVersion: 2.17.2
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: com.h2database
      artifactId: h2
      newVersion: 2.2.224
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.apache.tomcat.embed
      artifactId: tomcat-embed-core
      newVersion: 10.1.25
      overrideManagedVersion: true

  # 4. Eliminación de dependencias antiguas
  - org.openrewrite.java.dependencies.RemoveDependency: {groupId: junit, artifactId: junit}
  - org.openrewrite.java.dependencies.RemoveDependency: {groupId: io.springfox, artifactId: springfox-swagger-ui}
  - org.openrewrite.java.dependencies.RemoveDependency: {groupId: io.springfox, artifactId: springfox-core}
  - org.openrewrite.java.dependencies.RemoveDependency: {groupId: io.springfox, artifactId: springfox-bean-validators}
  - org.openrewrite.java.dependencies.RemoveDependency: {groupId: com.google.guava, artifactId: guava}
  - org.openrewrite.java.dependencies.RemoveDependency: {groupId: io.swagger, artifactId: swagger-annotations}
  - org.openrewrite.java.dependencies.RemoveDependency: {groupId: io.swagger, artifactId: swagger-models}

  # 5. Normalización de propiedades en POM
  - org.openrewrite.maven.AddProperty:
      key: spring.version
      value: "6.1.14"
      preserveExistingValue: false
  - org.openrewrite.maven.AddProperty:
      key: springframework.version
      value: "6.1.14"
      preserveExistingValue: false
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      groupPattern: org.springframework
      artifactPattern: "*"
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      groupPattern: jakarta.servlet
      artifactPattern: jakarta.servlet-api
  - org.openrewrite.maven.RemoveProperty: {propertyName: spring.version}
  - org.openrewrite.maven.RemoveProperty: {propertyName: springframework.version}
  - org.openrewrite.maven.RemoveProperty: {propertyName: log4j.version}
  - org.openrewrite.maven.RemoveProperty: {propertyName: junit.version}

  # 6. Limpieza final de imports huérfanos
  - org.openrewrite.java.RemoveUnusedImports